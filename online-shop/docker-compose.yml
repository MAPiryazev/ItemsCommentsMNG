services:
  db:
    image: postgres:latest
    container_name: online-shop-db
    restart: on-failure:5  #В случае ошибки контейнер попробует перезапуститься 5 раз
    env_file:
      - environment/.env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: